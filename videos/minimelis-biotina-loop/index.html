<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #12020a;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
      }
      #three-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-no-timeline
      data-start="0"
      data-duration="12.4"
      data-width="1080"
      data-height="1920"
    >
      <canvas
        id="three-layer"
        class="clip"
        width="1080"
        height="1920"
        data-start="0"
        data-duration="12.4"
        data-track-index="0"
      ></canvas>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { RoomEnvironment } from "three/addons/RoomEnvironment.js";

      // ---------------------------------------------------------------------
      // Timing. The hover section is periodic with LOOP seconds from LOOP_START
      // to the end, so [LOOP_START, LOOP_START + LOOP] loops seamlessly.
      // ---------------------------------------------------------------------
      const W = 1080;
      const H = 1920;
      const LOOP_START = 4.4;
      const LOOP = 8;
      const TAU = Math.PI * 2;

      const clamp01 = (x) => Math.min(1, Math.max(0, x));
      const span = (t, a, b) => clamp01((t - a) / (b - a));
      const smooth = (x) => x * x * (3 - 2 * x);
      const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const easeOut = (x) => 1 - Math.pow(1 - x, 3);
      const mix = (a, b, k) => a + (b - a) * k;
      const wave = (t, period, phase = 0) => Math.sin((TAU * t) / period + phase);

      function mulberry32(seed) {
        return function () {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
          return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
        };
      }

      // ---------------------------------------------------------------------
      // Renderer, scene, camera
      // ---------------------------------------------------------------------
      const canvas = document.getElementById("three-layer");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a0310);
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

      const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 200);

      // ---------------------------------------------------------------------
      // Measurements from the reference photo (units = bottle radius, 381 px).
      // Bottle base sits on the floor at y = FLOOR.
      // ---------------------------------------------------------------------
      const FLOOR = -1.95;
      const LABEL_BOTTOM = -1.646;
      const LABEL_HEIGHT = 2.194;
      const LABEL_ARC = THREE.MathUtils.degToRad(160);
      const NECK_TOP = 1.42;
      const CAP_BOTTOM = 1.25;
      const CAP_HEIGHT = 0.71;
      const CAP_RADIUS = 0.84;
      const CAP_OPEN_LIFT = 2.35;

      // ---------------------------------------------------------------------
      // Studio cyclorama (floor sweeping up into a back wall)
      // ---------------------------------------------------------------------
      {
        const geo = new THREE.PlaneGeometry(80, 1, 1, 240);
        const pos = geo.attributes.position;
        const bendR = 7;
        const floorFront = 30;
        const floorBack = -5;
        const floorLen = floorFront - floorBack;
        const arcLen = (Math.PI / 2) * bendR;
        const total = floorLen + arcLen + 40;
        for (let i = 0; i < pos.count; i++) {
          const s = (pos.getY(i) + 0.5) * total; // 0 at front edge
          let y;
          let z;
          if (s <= floorLen) {
            y = FLOOR;
            z = floorFront - s;
          } else if (s <= floorLen + arcLen) {
            const a = (s - floorLen) / bendR;
            y = FLOOR + bendR - Math.cos(a) * bendR;
            z = floorBack - Math.sin(a) * bendR;
          } else {
            y = FLOOR + bendR + (s - floorLen - arcLen);
            z = floorBack - bendR;
          }
          pos.setXYZ(i, pos.getX(i), y, z);
        }
        geo.computeVertexNormals();
        // PlaneGeometry faces +z; after bending the floor faces down, so flip.
        geo.scale(1, 1, 1);
        const cyc = new THREE.Mesh(
          geo,
          new THREE.MeshStandardMaterial({
            color: 0x6a0a2b,
            roughness: 0.82,
            metalness: 0,
            side: THREE.DoubleSide,
            envMapIntensity: 0.25,
          }),
        );
        scene.add(cyc);
      }

      // Soft contact shadow under the bottle
      function radialTexture(stops) {
        const c = document.createElement("canvas");
        c.width = c.height = 256;
        const g = c.getContext("2d");
        const grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
        stops.forEach(([o, col]) => grad.addColorStop(o, col));
        g.fillStyle = grad;
        g.fillRect(0, 0, 256, 256);
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }
      const shadow = new THREE.Mesh(
        new THREE.PlaneGeometry(3.6, 3.6),
        new THREE.MeshBasicMaterial({
          map: radialTexture([
            [0, "rgba(0,0,0,0.78)"],
            [0.45, "rgba(0,0,0,0.42)"],
            [1, "rgba(0,0,0,0)"],
          ]),
          transparent: true,
          depthWrite: false,
        }),
      );
      shadow.rotation.x = -Math.PI / 2;
      shadow.position.y = FLOOR + 0.003;
      scene.add(shadow);

      // ---------------------------------------------------------------------
      // Gummy geometry: round gummy with a flat base and a narrower flat top
      // (a rounded truncated cone), built as a lathe.
      // ---------------------------------------------------------------------
      function buildGummyGeometry() {
        const rBase = 0.28;
        const rTop = 0.2;
        const h = 0.3;
        const cBase = 0.085; // corner rounding at the base
        const cTop = 0.08; // corner rounding at the top
        const slant = Math.atan2(rBase - rTop, h);
        const pts = [new THREE.Vector2(0, -h / 2)];
        const arc = (cx, cy, r, a0, a1, n) => {
          for (let i = 0; i <= n; i++) {
            const a = a0 + ((a1 - a0) * i) / n;
            pts.push(new THREE.Vector2(cx + Math.cos(a) * r, cy + Math.sin(a) * r));
          }
        };
        arc(rBase - cBase, -h / 2 + cBase, cBase, -Math.PI / 2, slant, 12);
        arc(rTop - cTop * Math.cos(slant), h / 2 - cTop, cTop, slant, Math.PI / 2, 12);
        pts.push(new THREE.Vector2(0, h / 2));
        const geo = new THREE.LatheGeometry(pts, 96);
        geo.computeVertexNormals();
        return geo;
      }
      const gummyGeo = buildGummyGeometry();

      const heroGummyMat = new THREE.MeshPhysicalMaterial({
        color: 0x9c1240,
        roughness: 0.2,
        transmission: 0.7,
        thickness: 0.45,
        ior: 1.42,
        attenuationColor: new THREE.Color(0x5c0820),
        attenuationDistance: 0.32,
        clearcoat: 0.55,
        clearcoatRoughness: 0.18,
        specularIntensity: 0.7,
        envMapIntensity: 1.1,
      });
      // Gummies inside the bottle are seen through the bottle's transmission,
      // which only samples opaque objects, so they use an opaque look-alike.
      const innerGummyMat = new THREE.MeshPhysicalMaterial({
        color: 0x4f0a20,
        roughness: 0.3,
        clearcoat: 0.45,
        clearcoatRoughness: 0.25,
        sheen: 0.25,
        sheenColor: new THREE.Color(0xb3274f),
        sheenRoughness: 0.5,
        envMapIntensity: 0.9,
      });

      // ---------------------------------------------------------------------
      // Bottle
      // ---------------------------------------------------------------------
      const bottle = new THREE.Group();
      scene.add(bottle);

      {
        // Outer wall up to the lip, then back down the inside (wall 0.03).
        const pts = [];
        const push = (r, y) => pts.push(new THREE.Vector2(r, y));
        push(0.0, FLOOR + 0.02);
        push(0.6, FLOOR + 0.01);
        for (let i = 0; i <= 8; i++) {
          const a = (i / 8) * (Math.PI / 2);
          push(0.86 + Math.sin(a) * 0.14, FLOOR + 0.14 - Math.cos(a) * 0.14);
        }
        push(1.0, 0.92);
        for (let i = 1; i <= 10; i++) {
          const a = (i / 10) * (Math.PI / 2);
          push(0.76 + Math.cos(a) * 0.24, 0.92 + Math.sin(a) * 0.22);
        }
        push(0.745, 1.18);
        push(0.745, 1.24);
        push(0.775, 1.25); // neck support ring
        push(0.775, 1.28);
        push(0.72, 1.29);
        push(0.72, NECK_TOP - 0.02);
        push(0.7, NECK_TOP);
        push(0.67, NECK_TOP);
        push(0.655, NECK_TOP - 0.02);
        push(0.69, 1.14);
        push(0.97, 0.92);
        push(0.97, FLOOR + 0.14);
        push(0.86, FLOOR + 0.04);
        push(0.0, FLOOR + 0.05);
        const geo = new THREE.LatheGeometry(pts, 160);
        const plastic = new THREE.MeshPhysicalMaterial({
          color: 0xffffff,
          roughness: 0.04,
          metalness: 0,
          transmission: 1,
          thickness: 0.06,
          ior: 1.55,
          clearcoat: 1,
          clearcoatRoughness: 0.04,
          specularIntensity: 1,
          envMapIntensity: 1.4,
          side: THREE.DoubleSide,
        });
        const body = new THREE.Mesh(geo, plastic);
        body.renderOrder = 2;
        bottle.add(body);

        // Neck threads (visible once the cap is off)
        const threadMat = plastic.clone();
        for (let i = 0; i < 2; i++) {
          const ring = new THREE.Mesh(new THREE.TorusGeometry(0.722, 0.014, 10, 120), threadMat);
          ring.rotation.x = Math.PI / 2;
          ring.position.y = 1.32 + i * 0.045;
          bottle.add(ring);
        }
      }

      // Label: the unwrapped photo on the front 160 deg, plain label elsewhere.
      const labelTex = new THREE.TextureLoader().load("assets/label-front.png");
      labelTex.colorSpace = THREE.SRGBColorSpace;
      labelTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      {
        const r = 1.006;
        const front = new THREE.Mesh(
          new THREE.CylinderGeometry(r, r, LABEL_HEIGHT, 200, 1, true, -LABEL_ARC / 2, LABEL_ARC),
          new THREE.MeshPhysicalMaterial({
            map: labelTex,
            roughness: 0.42,
            clearcoat: 0.35,
            clearcoatRoughness: 0.3,
            envMapIntensity: 0.6,
          }),
        );
        front.position.y = LABEL_BOTTOM + LABEL_HEIGHT / 2;
        bottle.add(front);
        const back = new THREE.Mesh(
          new THREE.CylinderGeometry(
            r,
            r,
            LABEL_HEIGHT,
            120,
            1,
            true,
            LABEL_ARC / 2,
            TAU - LABEL_ARC,
          ),
          new THREE.MeshPhysicalMaterial({ color: 0xf3f2ef, roughness: 0.42, envMapIntensity: 0.6 }),
        );
        back.position.y = front.position.y;
        bottle.add(back);
      }

      // Gummies packed inside the bottle (seeded, deterministic)
      {
        const rand = mulberry32(20261007);
        const dummy = new THREE.Object3D();
        const placements = [];
        for (let layer = 0; layer < 14; layer++) {
          const y = FLOOR + 0.28 + layer * 0.205;
          const offset = rand() * TAU;
          for (const [count, radius] of [[8, 0.66], [4, 0.3]]) {
            for (let j = 0; j < count; j++) {
              const a = offset + (j / count) * TAU + (rand() - 0.5) * 0.5;
              const rr = radius + (rand() - 0.5) * 0.1;
              placements.push([Math.cos(a) * rr, y + (rand() - 0.5) * 0.12, Math.sin(a) * rr]);
            }
          }
        }
        const inner = new THREE.InstancedMesh(gummyGeo, innerGummyMat, placements.length);
        placements.forEach((p, i) => {
          dummy.position.set(p[0], p[1], p[2]);
          dummy.rotation.set(rand() * TAU, rand() * TAU, rand() * TAU);
          dummy.scale.setScalar(0.95 + rand() * 0.12);
          dummy.updateMatrix();
          inner.setMatrixAt(i, dummy.matrix);
        });
        bottle.add(inner);
      }

      // ---------------------------------------------------------------------
      // Cap: lathe body with 120 knurled ribs, hollow inside
      // ---------------------------------------------------------------------
      const cap = new THREE.Group();
      // Spin about the cap's own axis first, then tilt, so the hover stays periodic.
      cap.rotation.order = "ZXY";
      scene.add(cap);
      {
        const pts = [];
        const push = (r, y) => pts.push(new THREE.Vector2(r, y));
        push(0.79, 0);
        push(CAP_RADIUS, 0.0);
        push(CAP_RADIUS, 0.02);
        for (let i = 0; i <= 16; i++) push(CAP_RADIUS, 0.03 + (i / 16) * 0.6);
        for (let i = 1; i <= 6; i++) {
          const a = (i / 6) * (Math.PI / 2);
          push(CAP_RADIUS - 0.06 + Math.cos(a) * 0.06, 0.63 + Math.sin(a) * 0.08);
        }
        push(0.4, CAP_HEIGHT);
        push(0.0, CAP_HEIGHT);
        const geo = new THREE.LatheGeometry(pts, 960);
        const pos = geo.attributes.position;
        const RIBS = 120;
        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i);
          const y = pos.getY(i);
          const z = pos.getZ(i);
          const r = Math.hypot(x, z);
          if (y > 0.04 && y < 0.62 && r > CAP_RADIUS - 0.001) {
            const a = Math.atan2(x, z);
            const rib = Math.pow(Math.abs(Math.cos((a * RIBS) / 2)), 0.6);
            const fade = smooth(span(y, 0.04, 0.09)) * (1 - smooth(span(y, 0.57, 0.62)));
            const nr = CAP_RADIUS + 0.012 * rib * fade;
            pos.setXYZ(i, (x / r) * nr, y, (z / r) * nr);
          }
        }
        geo.computeVertexNormals();
        const capMat = new THREE.MeshPhysicalMaterial({
          color: 0xf6f5f2,
          roughness: 0.36,
          clearcoat: 0.25,
          clearcoatRoughness: 0.35,
          envMapIntensity: 0.9,
        });
        const outer = new THREE.Mesh(geo, capMat);
        cap.add(outer);

        const innerPts = [
          new THREE.Vector2(0.0, CAP_HEIGHT - 0.06),
          new THREE.Vector2(0.79, CAP_HEIGHT - 0.06),
          new THREE.Vector2(0.79, 0.0),
        ];
        const innerGeo = new THREE.LatheGeometry(innerPts, 160);
        const innerMat = new THREE.MeshStandardMaterial({
          color: 0xdedcd8,
          roughness: 0.6,
          side: THREE.DoubleSide,
        });
        cap.add(new THREE.Mesh(innerGeo, innerMat));
        // Liner disc inside the cap
        const liner = new THREE.Mesh(
          new THREE.CircleGeometry(0.78, 96),
          new THREE.MeshStandardMaterial({ color: 0xe9e7e2, roughness: 0.7, side: THREE.DoubleSide }),
        );
        liner.rotation.x = Math.PI / 2;
        liner.position.y = CAP_HEIGHT - 0.07;
        cap.add(liner);
      }

      // ---------------------------------------------------------------------
      // The three hero gummies
      // ---------------------------------------------------------------------
      const heroes = [
        { base: [-0.92, 2.25, 0.3], yaw: -0.5, dir: 1, phase: 0.0, tilt: 0.3, roll: 0.16 },
        { base: [0.04, 2.78, 0.6], yaw: 0.1, dir: -1, phase: 2.1, tilt: 0.22, roll: -0.06 },
        { base: [0.95, 2.2, 0.2], yaw: 0.6, dir: 1, phase: 4.2, tilt: 0.32, roll: -0.18 },
      ].map((h) => {
        const mesh = new THREE.Mesh(gummyGeo, heroGummyMat);
        mesh.scale.setScalar(1.6);
        scene.add(mesh);
        return { ...h, mesh };
      });

      // ---------------------------------------------------------------------
      // Lights
      // ---------------------------------------------------------------------
      const key = new THREE.DirectionalLight(0xfff4ec, 2.6);
      key.position.set(-5, 7, 9);
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xffe3ea, 0.7);
      fill.position.set(6, 2, 7);
      scene.add(fill);
      const rimL = new THREE.SpotLight(0xffd6e2, 120, 30, 0.55, 0.8, 1.6);
      rimL.position.set(-5.5, 4, -5);
      rimL.target.position.set(0, 0.8, 0);
      scene.add(rimL, rimL.target);
      const rimR = new THREE.SpotLight(0xffe9ef, 120, 30, 0.55, 0.8, 1.6);
      rimR.position.set(5.5, 3.5, -5);
      rimR.target.position.set(0, 0.8, 0);
      scene.add(rimR, rimR.target);
      // Pool of light on the backdrop behind the product
      const backPool = new THREE.SpotLight(0xff3f78, 150, 40, 0.38, 1, 1.4);
      backPool.position.set(0, 9, 6);
      backPool.target.position.set(0, 1.5, -11);
      scene.add(backPool, backPool.target);
      // Glow that backlights the floating gummies
      const gummyGlow = new THREE.PointLight(0xff5d8f, 0, 6, 1.8);
      gummyGlow.position.set(0, 2.6, -1.4);
      scene.add(gummyGlow);

      // ---------------------------------------------------------------------
      // Animation
      // ---------------------------------------------------------------------
      // Blend weight from a scripted path into the periodic hover state.
      const settle = (t, a, b) => smooth(span(t, a, b));

      function capState(t) {
        const unscrew = easeInOut(span(t, 1.5, 2.7));
        const lift = span(t, 2.55, 3.95);
        const hoverY = CAP_BOTTOM + CAP_OPEN_LIFT + 0.06 * wave(t, LOOP / 2, 0.8);
        const pathY = CAP_BOTTOM + 0.1 * unscrew;
        const y = mix(pathY, hoverY, easeOut(lift));
        const rx = mix(0, -0.24 + 0.04 * wave(t, LOOP, 0.3), easeOut(lift));
        const rz = mix(0, 0.1 + 0.035 * wave(t, LOOP / 2, 1.7), easeOut(lift));
        const ry = TAU * 1.25 * unscrew + mix(0, (TAU * (t - 3.95)) / (LOOP * 2), settle(t, 3.95, 4.4));
        return { y, rx, ry, rz };
      }

      function heroHover(h, t) {
        const [bx, by, bz] = h.base;
        return {
          x: bx + 0.035 * wave(t, LOOP, h.phase + 1),
          y: by + 0.085 * wave(t, LOOP / 2, h.phase),
          z: bz + 0.03 * wave(t, LOOP, h.phase + 2),
          rx: h.tilt + 0.08 * wave(t, LOOP / 2, h.phase + 0.5),
          ry: h.yaw + (h.dir * TAU * t) / LOOP,
          rz: h.roll + 0.1 * wave(t, LOOP, h.phase + 1.3),
        };
      }

      function heroState(h, i, t) {
        const hover = heroHover(h, t);
        const t0 = 2.85 + i * 0.15;
        const u = span(t, t0, t0 + 1.25);
        const k = easeOut(u);
        const start = { x: 0, y: 0.85, z: 0, rx: 1.2, ry: hover.ry - h.dir * 2.4, rz: -0.6 };
        const out = {};
        for (const key of ["x", "y", "z", "rx", "ry", "rz"]) out[key] = mix(start[key], hover[key], k);
        // A little extra lift mid-flight so they pop out of the neck
        out.y += Math.sin(Math.PI * u) * 0.25;
        out.visible = t >= t0;
        out.scale = mix(1.0, 1.6, smooth(u));
        return out;
      }

      function cameraState(t) {
        // Intro: slow dolly-in on the closed bottle
        const dollyIn = easeInOut(span(t, 0, 2.2));
        let z = mix(14.2, 12.4, dollyIn);
        let y = mix(-0.2, 0.25, dollyIn);
        let ty = mix(-0.15, 0.05, dollyIn);
        // Opening: ease back and tilt up to frame the gap above the neck
        const out = easeInOut(span(t, 2.2, 4.0));
        z = mix(z, 14.8 + 0.25 * wave(t, LOOP, 0.4), out);
        y = mix(y, 1.7 + 0.12 * wave(t, LOOP, 2.0), out);
        ty = mix(ty, 1.25, out);
        const x = mix(0, 0.55 * wave(t, LOOP, 0), settle(t, 3.0, 4.4));
        return { x, y, z, ty };
      }

      function renderAt(t) {
        // Light reveal out of darkness
        const reveal = smooth(span(t, 0.05, 2.0));
        renderer.toneMappingExposure = mix(0.12, 1.0, reveal);
        scene.environmentIntensity = mix(0.05, 0.85, smooth(span(t, 0.4, 2.4)));
        key.intensity = 2.6 * smooth(span(t, 0.5, 2.1));
        fill.intensity = 0.7 * smooth(span(t, 0.8, 2.3));
        // Rim light sweeps around the contour, then settles
        const sweep = easeInOut(span(t, 0.0, 2.2));
        rimL.position.set(mix(-1.5, -5.5, sweep), mix(1.0, 4.0, sweep), -5);
        rimL.intensity = 120 * smooth(span(t, 0.0, 0.9));
        rimR.intensity = 120 * smooth(span(t, 0.9, 2.2));
        backPool.intensity = 150 * smooth(span(t, 0.6, 2.6));
        gummyGlow.intensity = 9 * smooth(span(t, 3.0, 4.2)) * (1 + 0.12 * wave(t, LOOP / 2, 0));

        // Bottle: slight turn into position, then a gentle periodic sway
        bottle.rotation.y = mix(-0.32 * (1 - easeOut(span(t, 0, 2.4))), 0.07 * wave(t, LOOP, 1.1), settle(t, 2.4, 4.4));

        const c = capState(t);
        cap.position.set(0, c.y, 0);
        cap.rotation.set(c.rx, c.ry, c.rz);

        heroes.forEach((h, i) => {
          const s = heroState(h, i, t);
          h.mesh.visible = s.visible;
          h.mesh.position.set(s.x, s.y, s.z);
          h.mesh.rotation.set(s.rx, s.ry, s.rz);
          h.mesh.scale.setScalar(s.scale);
        });

        const cam = cameraState(t);
        camera.position.set(cam.x, cam.y, cam.z);
        camera.lookAt(0, cam.ty, 0);
        renderer.render(scene, camera);
      }

      window.addEventListener("hf-seek", (event) => renderAt(event.detail.time));
      renderAt(window.__hfThreeTime || 0);
    </script>
  </body>
</html>
